# 淘宝/天猫平台配置
#
# 以下选择器基于 2026-09 真实页面实测校准。
# 天猫/淘宝商品页使用 CSS Modules（class 带 hash 后缀，每次部署会变），
# 因此全部用文字定位和 JS 点击，不依赖固定 class 名。

platform:
  id: taobao
  name: 淘宝
  icon: icons/taobao.png
  home: https://www.taobao.com/
  match:
    - item.taobao.com
    - detail.tmall.com
    - item.m.taobao.com
    - h5.m.taobao.com
  sku_pattern: '[?&]id=(\d+)'
  user_agent: >-
    Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36
  block_markers:
    - "punish"
    - "captcha"
    - "x5secdata"

login:
  url: https://login.taobao.com/member/login.jhtml
  timeout: 180
  qr_switch:
    by: xpath
    value: "//*[contains(text(),'扫码登录')]"
  logged_in_cookies:
    - cookie2
    - sgcookie
    - _tb_token_
  logged_in_selectors:
    - "css:.site-nav-login-info-nick"

api:
  enabled: false
  steps: []

dom:
  prepare:
    - action: goto
      value: "{url}"
      timeout: 45000
      desc: 打开商品页
    - action: sleep
      ms: 3000
      desc: 等待页面渲染
    - action: wait_visible
      by: text
      value: "加入购物车"
      timeout: 15000
      optional: true
      desc: 等待购买按钮出现

  specs: []
  # 示例（需要选规格时取消注释）：
  #   - action: click_text
  #     texts: ["黑色"]
  #     timeout: 3000
  #     optional: true
  #     desc: 选择规格

  fire:
    - action: click_text
      texts:
        - "立即购买"
        - "立即抢购"
        - "马上抢"
        - "领券购买"
      timeout: 5000
      desc: 点击购买按钮
    - action: wait_title
      value: "确认订单"
      timeout: 10000
      optional: true
      desc: 等待进入下单页
    - action: sleep
      ms: 2000
      desc: 等待下单页渲染
    - action: click
      by: id
      value: "submitOrder"
      timeout: 8000
      desc: 点击提交订单
    - action: click_text
      texts:
        - "立即支付"
        - "提交订单"
        - "确认提交"
      timeout: 5000
      optional: true
      desc: 兜底提交

  # 提交订单后通常跳转到支付页（pay/cashier），或停留在确认页等待用户操作。
  # 留空表示不检查 URL，步骤走完即算成功。
  success_url: ""
